<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCall - Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        discord: {
                            darker: '#202225',
                            dark: '#2f3136',
                            main: '#36393f',
                            light: '#40444b',
                            blurple: '#5865F2',
                            blurpleHover: '#4752C4'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2f3136; }
        ::-webkit-scrollbar-thumb { background: #202225; border-radius: 4px; }
    </style>
</head>
<body class="bg-discord-main text-gray-200 h-screen overflow-hidden flex font-sans">

    <!-- Tela de Login Nativa -->
    <div id="login-screen" class="absolute inset-0 bg-discord-main z-50 flex items-center justify-center">
        <div class="bg-discord-dark p-8 rounded-lg shadow-2xl w-96 text-center">
            <h2 class="text-2xl font-bold mb-6 text-white" id="auth-title">Entrar na Call</h2>
            
            <div class="space-y-4">
                <input type="text" id="auth-name" placeholder="Como seus amigos vão te chamar?" class="w-full bg-discord-darker text-white p-3 rounded outline-none focus:ring-1 focus:ring-discord-blurple hidden">
                <input type="email" id="auth-email" placeholder="E-mail" class="w-full bg-discord-darker text-white p-3 rounded outline-none focus:ring-1 focus:ring-discord-blurple">
                <input type="password" id="auth-pass" placeholder="Senha (mínimo 6 caracteres)" class="w-full bg-discord-darker text-white p-3 rounded outline-none focus:ring-1 focus:ring-discord-blurple">
                
                <button id="auth-btn" class="w-full bg-discord-blurple hover:bg-discord-blurpleHover text-white font-semibold py-3 px-4 rounded transition">
                    Entrar
                </button>
            </div>

            <p id="auth-error" class="text-red-400 text-sm mt-3 hidden"></p>
            <p class="mt-4 text-sm text-gray-400 cursor-pointer hover:text-white transition" id="toggle-auth">
                Primeira vez aqui? Crie uma conta
            </p>
        </div>
    </div>

    <!-- Layout Principal -->
    <div id="app-screen" class="flex w-full h-full hidden">
        
        <!-- Sidebar -->
        <div class="w-64 bg-discord-dark flex flex-col">
            <div class="p-4 border-b border-discord-darker flex items-center gap-3">
                <img id="user-avatar" src="" class="w-10 h-10 rounded-full bg-discord-light">
                <span id="user-name" class="font-bold text-white truncate">Usuário</span>
            </div>
            
            <div class="p-4 flex-1 flex flex-col gap-4">
                <div class="bg-discord-darker p-3 rounded">
                    <p class="text-xs text-gray-400 font-bold uppercase mb-2">Sua ID de Voz</p>
                    <input type="text" id="my-peer-id" readonly class="w-full bg-transparent text-sm text-gray-300 outline-none cursor-text">
                </div>

                <div class="space-y-2">
                    <input type="text" id="friend-id" placeholder="ID do amigo..." class="w-full bg-discord-darker text-sm p-2 rounded outline-none focus:ring-1 focus:ring-discord-blurple">
                    <button id="connect-call" class="w-full bg-green-600 hover:bg-green-700 text-white p-2 rounded text-sm font-semibold transition">
                        📞 Ligar
                    </button>
                </div>

                <button id="share-screen" class="w-full bg-discord-light hover:bg-gray-600 text-white p-2 rounded text-sm font-semibold transition">
                    💻 Compartilhar Tela
                </button>
            </div>

            <div class="p-4 bg-discord-darker">
                <button id="logout-btn" class="w-full text-red-400 hover:text-red-300 text-sm font-semibold transition">Desconectar</button>
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- Grid de Vídeo -->
            <div id="video-grid" class="flex-1 bg-black p-4 flex gap-4 flex-wrap justify-center items-center overflow-y-auto">
                <!-- Vídeos renderizados aqui -->
            </div>

            <!-- Chat -->
            <div class="h-1/3 min-h-[250px] bg-discord-main flex flex-col border-t border-discord-darker">
                <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Mensagens renderizadas aqui -->
                </div>
                
                <div class="p-4 bg-discord-main">
                    <div class="bg-discord-light rounded-lg flex items-center px-4 py-2">
                        <label for="file-input" class="cursor-pointer text-gray-400 hover:text-white mr-4 text-xl">+</label>
                        <input type="file" id="file-input" class="hidden">
                        <input type="text" id="message-input" placeholder="Conversar em #geral..." class="flex-1 bg-transparent border-none outline-none text-gray-200 placeholder-gray-500">
                        <button id="send-btn" class="hidden"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module" src="app.js"></script>
</body>
</html>
